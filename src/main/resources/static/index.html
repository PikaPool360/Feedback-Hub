<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Hub</title>
<style>
  :root { color-scheme: dark; --bg: #090d18; --panel: #111827; --line: #263247; --text: #edf2ff; --muted: #9aa8bf; --accent: #8b9cff; --accent2: #b39aff; }
  * { box-sizing: border-box; }
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 56px 22px 72px; color: var(--text); background: radial-gradient(ellipse at 50% -20%, #25234c 0, var(--bg) 58%); min-height: 100vh; }
  h1 { margin: 0; font-size: clamp(2.3rem, 7vw, 4rem); letter-spacing: -.055em; line-height: 1.05; }
  h2 { margin: 0 0 20px; font-size: 1.25rem; letter-spacing: -.02em; }
  body > p { margin: 12px 0 18px; }
  nav { margin: 22px 0 28px; }
  a { color: #bac4ff; text-decoration: none; font-weight: 650; }
  a:hover { color: white; text-decoration: underline; }
  section { border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin: 18px 0; background: linear-gradient(145deg, rgba(19,28,45,.96), rgba(15,21,35,.96)); box-shadow: 0 18px 50px rgba(0,0,0,.18); }
  label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; color: #c6d0e2; }
  input, select, textarea { width: 100%; padding: 12px 13px; margin-top: 7px; border: 1px solid #34415a; border-radius: 10px; color: var(--text); background: #0c1322; font: inherit; outline: none; transition: border-color .18s, box-shadow .18s; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,156,255,.16); }
  textarea { resize: vertical; }
  button { margin-top: 18px; padding: 10px 17px; border: 0; border-radius: 10px; color: #101426; background: linear-gradient(135deg, #aeb8ff, #c1a5ff); font: inherit; font-weight: 700; cursor: pointer; transition: transform .18s, filter .18s; }
  button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 200px; }
  .meta { font-size: 14px; color: var(--muted); }
  .error, .ok { margin-top: 12px; font-size: 14px; }
  .error { color: #ff9caa; } .ok { color: #8be0ba; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; }
  .stats span { flex: 1; min-width: 170px; padding: 15px; border: 1px solid var(--line); border-radius: 12px; color: #dce4f5; background: rgba(8,13,24,.55); }
  @media (max-width: 560px) { body { padding: 36px 16px 52px; } section { padding: 19px; border-radius: 15px; } }
</style>
</head>
<body>
<h1>Feedback Hub</h1>
<p class="meta">Submit feedback and see a live summary.</p>
<nav><a href="/feedback.html">Browse all feedback</a></nav>

<section>
  <h2>Submit feedback</h2>
  <div class="row">
    <div><label for="name">Name</label><input id="name" maxlength="100"></div>
    <div><label for="email">Email</label><input id="email" type="email" maxlength="150"></div>
  </div>
  <div class="row">
    <div><label for="category">Category</label><select id="category"><option>GENERAL</option><option>BUG</option><option>FEATURE</option><option>PRAISE</option></select></div>
    <div><label for="rating">Rating</label><select id="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
  </div>
  <label for="message">Message</label>
  <textarea id="message" rows="3" maxlength="2000"></textarea>
  <button id="submitBtn">Submit</button><div id="formMsg"></div>
</section>

<section><h2>Summary</h2><div id="summary" class="stats">Loading...</div></section>
<script>
  const API = "/api/feedback";
  const $ = id => document.getElementById(id);
  function el(tag, text) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; return e; }
  async function loadSummary() {
    const s = await (await fetch(API + "/summary")).json();
    const box = $("summary"); box.replaceChildren();
    box.append(el("span", "Total: " + s.totalCount));
    box.append(el("span", "Average rating: " + s.averageRating));
    box.append(el("span", "By category: " + Object.entries(s.countByCategory).map(([k, v]) => k + " " + v).join(", ")));
  }
  async function submitFeedback() {
    const body = { name: $("name").value, email: $("email").value, category: $("category").value, rating: Number($("rating").value), message: $("message").value };
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const box = $("formMsg");
    if (res.ok) { box.className = "ok"; box.textContent = "Thanks, your feedback was saved."; $("name").value = ""; $("email").value = ""; $("message").value = ""; loadSummary(); }
    else { const err = await res.json(); const details = Object.entries(err.details || {}).map(([f, m]) => f + ": " + m).join("; "); box.className = "error"; box.textContent = err.message + (details ? " (" + details + ")" : ""); }
  }
  $("submitBtn").onclick = submitFeedback;
  loadSummary();
</script>
</body>
</html>
